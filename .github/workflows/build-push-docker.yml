name: Build Push Docker Image
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: choice
        options:
          - latest
          - stable
        default: latest
  push:
    tags:
      - "v*"

jobs:
  test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: push/uv.lock

      - name: Install dependencies
        working-directory: push
        run: uv sync --frozen

      - name: Run tests
        working-directory: push
        run: uv run pytest

  build-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./push
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/train-dashboard-push:${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'stable' || github.event.inputs.tag || 'latest' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
